<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Subir Comprobante</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #ffffff; width: 100%; max-width: 440px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #1a73e8; margin: 0 0 16px 0; text-align: center; font-size: 20px; }
    label { font-weight: 600; font-size: 13px; color: #444; margin-top: 12px; display: block; }
    input[type="text"], textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid #dcdfe6; 
      border-radius: 10px; 
      font-size: 14px; 
      margin-top: 6px; 
      outline: none; 
      font-family: inherit;
    }
    input[type="text"]:focus, textarea:focus { border-color: #1a73e8; }
    textarea { resize: vertical; min-height: 60px; }

    .cam-container {
      margin-top: 12px;
      border: 2px dashed #1a73e8;
      border-radius: 12px;
      background: #111;
      position: relative;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    video#videoStream {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: none;
    }
    img#fotoPreview {
      width: 100%;
      height: 260px;
      object-fit: contain;
      background: #000;
      display: none;
    }
    canvas#canvasSnapshot { display: none; }

    .cam-btn {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-abrir { background: #1a73e8; color: white; margin: 20px 0; }
    .btn-disparo {
      position: absolute;
      bottom: 12px;
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: none;
    }
    .btn-repetir {
      position: absolute;
      bottom: 12px;
      background: rgba(255,255,255,0.9);
      color: #333;
      display: none;
    }

    button#btnEnviar {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 20px;
      cursor: pointer;
    }
    button#btnEnviar:disabled { background: #c2eed1; cursor: not-allowed; }

    #statusBox {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
      font-weight: 600;
    }
    .status-info { background: #e8f0fe; color: #1a73e8; display: block !important; }
    .status-ok { background: #e6f4ea; color: #137333; display: block !important; }
    .status-error { background: #fce8e6; color: #c5221f; display: block !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Registro de Comprobante</h2>

    <label for="clienteInput">Cliente / Referencia (Opcional):</label>
    <input type="text" id="clienteInput" placeholder="Ej: Varinia, Pedido 102...">

    <label for="mensajeInput">Mensaje para WhatsApp (Opcional):</label>
    <textarea id="mensajeInput" placeholder="Escribe un mensaje opcional para acompañar la foto..."></textarea>

    <label>Foto del comprobante:</label>
    <div class="cam-container" id="camBox">
      <button type="button" class="cam-btn btn-abrir" id="btnIniciar" onclick="abrirCamara()">📷 Encender Cámara</button>
      <video id="videoStream" autoplay playsinline muted></video>
      <img id="fotoPreview" alt="Vista previa">
      <canvas id="canvasSnapshot"></canvas>
      <button type="button" class="cam-btn btn-disparo" id="btnCapturar" onclick="capturarFoto()">⚪ Tomar Foto</button>
      <button type="button" class="cam-btn btn-repetir" id="btnRepetir" onclick="reiniciarCamara()">🔄 Repetir</button>
    </div>

    <button type="button" id="btnEnviar" disabled onclick="enviar()">Guardar y Seleccionar en WhatsApp</button>
    <div id="statusBox"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJVTsMtLzcSNSS0I4nLMeEn7vLFwpgofotvXdTwfYQjE_xTFqYr5-YXtKNorHHvzxjDg/exec";

    let base64Comprimido = "";
    let streamActual = null;

    async function abrirCamara() {
      const video = document.getElementById('videoStream');
      const btnIniciar = document.getElementById('btnIniciar');
      const btnCapturar = document.getElementById('btnCapturar');
      
      try {
        streamActual = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = streamActual;
        video.style.display = "block";
        btnIniciar.style.display = "none";
        btnCapturar.style.display = "inline-flex";
      } catch (err) {
        alert("Permite el acceso a la cámara en el navegador: " + err.message);
      }
    }

    function capturarFoto() {
      const video = document.getElementById('videoStream');
      const canvas = document.getElementById('canvasSnapshot');
      const preview = document.getElementById('fotoPreview');
      const btnCapturar = document.getElementById('btnCapturar');
      const btnRepetir = document.getElementById('btnRepetir');

      const maxDim = 1200;
      let w = video.videoWidth || 1280;
      let h = video.videoHeight || 720;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      base64Comprimido = canvas.toDataURL('image/jpeg', 0.75);

      if (streamActual) {
        streamActual.getTracks().forEach(t => t.stop());
      }
      video.style.display = "none";
      btnCapturar.style.display = "none";

      preview.src = base64Comprimido;
      preview.style.display = "block";
      btnRepetir.style.display = "inline-flex";

      document.getElementById('btnEnviar').disabled = false;
    }

    function reiniciarCamara() {
      base64Comprimido = "";
      document.getElementById('fotoPreview').style.display = "none";
      document.getElementById('btnRepetir').style.display = "none";
      document.getElementById('btnEnviar').disabled = true;
      abrirCamara();
    }

    async function enviar() {
      const btn = document.getElementById('btnEnviar');
      const cliente = document.getElementById('clienteInput').value.trim();
      const customMsg = document.getElementById('mensajeInput').value.trim();

      btn.disabled = true;
      mostrarEstado("⏳ Guardando en Drive...", "status-info");

      const payload = {
        cliente: cliente,
        fotoBase64: base64Comprimido
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data && data.status === "ok") {
          mostrarEstado("✓ ¡Guardado! Abriendo WhatsApp...", "status-ok");
          
          let textoFinal = "";
          if (customMsg !== "") {
            textoFinal = customMsg + "\n\n📄 " + data.urlFoto;
          } else {
            textoFinal = "📄 Comprobante: " + data.urlFoto;
          }
          
          const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textoFinal);
          setTimeout(() => {
            window.location.href = waUrl;
          }, 300);
        } else {
          throw new Error(data ? data.message : "Error");
        }
      } catch (err) {
        mostrarEstado("✓ ¡Listo! Abriendo WhatsApp...", "status-ok");
        let fallbackMsg = customMsg !== "" ? customMsg : "Comprobante de venta adjunto.";
        const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(fallbackMsg);
        setTimeout(() => {
          window.location.href = waUrl;
        }, 500);
      }
    }

    function mostrarEstado(txt, clase) {
      const box = document.getElementById('statusBox');
      box.className = clase;
      box.innerText = txt;
    }
  </script>
</body>
</html>
