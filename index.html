<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Registro de Comprobantes</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #ffffff; width: 100%; max-width: 440px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #1a73e8; margin: 0 0 16px 0; text-align: center; font-size: 20px; }
    label { font-weight: 600; font-size: 13px; color: #444; margin-top: 12px; display: block; }
    input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #dcdfe6; border-radius: 10px; font-size: 15px; margin-top: 6px; outline: none; }
    input[type="text"]:focus { border-color: #1a73e8; }
    
    /* Contenedor de Cámara en pantalla */
    .cam-container {
      margin-top: 10px;
      border: 2px dashed #1a73e8;
      border-radius: 12px;
      background: #111;
      position: relative;
      overflow: hidden;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    video#videoStream {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: none;
    }
    img#fotoPreview {
      width: 100%;
      height: 260px;
      object-fit: contain;
      background: #000;
      display: none;
    }
    canvas#canvasSnapshot { display: none; }
    
    .cam-btn {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-abrir { background: #1a73e8; color: white; margin: 20px 0; }
    .btn-disparo {
      position: absolute;
      bottom: 12px;
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: none;
    }
    .btn-repetir {
      position: absolute;
      bottom: 12px;
      background: rgba(255,255,255,0.9);
      color: #333;
      display: none;
    }

    button#btnEnviar {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#btnEnviar:disabled { background: #c2eed1; cursor: not-allowed; }

    #statusBox {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
      font-weight: 600;
    }
    .status-info { background: #e8f0fe; color: #1a73e8; display: block !important; }
    .status-ok { background: #e6f4ea; color: #137333; display: block !important; }
    .status-error { background: #fce8e6; color: #c5221f; display: block !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Registro de Comprobante</h2>

    <label for="clienteInput">1. Cliente:</label>
    <input list="listaClientes" id="clienteInput" placeholder="Buscar o escribir cliente..." oninput="seleccionarCliente()">
    <datalist id="listaClientes"></datalist>

    <label>2. Foto del comprobante:</label>
    <div class="cam-container" id="camBox">
      <button type="button" class="cam-btn btn-abrir" id="btnIniciar" onclick="abrirCamara()">📷 Encender Cámara</button>
      <video id="videoStream" autoplay playsinline muted></video>
      <img id="fotoPreview" alt="Vista previa">
      <canvas id="canvasSnapshot"></canvas>
      <button type="button" class="cam-btn btn-disparo" id="btnCapturar" onclick="capturarFoto()">⚪ Tomar Foto</button>
      <button type="button" class="cam-btn btn-repetir" id="btnRepetir" onclick="reiniciarCamara()">🔄 Repetir</button>
    </div>

    <button type="button" id="btnEnviar" disabled onclick="enviar()">Guardar y Enviar por WhatsApp</button>
    <div id="statusBox"></div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTA URL CON LA TUYA DE APPS SCRIPT (/exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCj_v-jB0oZj6scGHg1pZrTl7Z1qm1DRBU6XmmpqQyPkANNqZYt_tFBz4ygJGJk7TgFg/exec";

    let clientes = [];
    let telefonoActual = "";
    let base64Comprimido = "";
    let streamActual = null;

    window.onload = function() {
      // Restaurar cliente si hubiera algún refresco
      const guardado = localStorage.getItem('cliente_temp');
      if (guardado) {
        document.getElementById('clienteInput').value = guardado;
      }
      cargarListaClientes();
    };

    async function cargarListaClientes() {
      mostrarEstado("Cargando clientes...", "status-info");
      try {
        const resp = await fetch(SCRIPT_URL + "?action=getClientes");
        clientes = await resp.json();
        const dl = document.getElementById('listaClientes');
        dl.innerHTML = "";
        clientes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.nombre;
          dl.appendChild(opt);
        });
        seleccionarCliente();
        mostrarEstado("", "");
      } catch (e) {
        mostrarEstado("Modo sin conexión rápida", "status-info");
      }
    }

    function seleccionarCliente() {
      const val = document.getElementById('clienteInput').value.trim();
      localStorage.setItem('cliente_temp', val);
      const enc = clientes.find(c => c.nombre.toLowerCase() === val.toLowerCase());
      telefonoActual = enc ? enc.telefono : "";
      validar();
    }

    // Cámara dentro del navegador (Cero consumo externo, no se reinicia)
    async function abrirCamara() {
      const video = document.getElementById('videoStream');
      const btnIniciar = document.getElementById('btnIniciar');
      const btnCapturar = document.getElementById('btnCapturar');
      
      try {
        streamActual = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 }
          },
          audio: false
        });
        video.srcObject = streamActual;
        video.style.display = "block";
        btnIniciar.style.display = "none";
        btnCapturar.style.display = "inline-flex";
      } catch (err) {
        alert("Por favor da permiso a la cámara en el navegador: " + err.message);
      }
    }

    function capturarFoto() {
      const video = document.getElementById('videoStream');
      const canvas = document.getElementById('canvasSnapshot');
      const preview = document.getElementById('fotoPreview');
      const btnCapturar = document.getElementById('btnCapturar');
      const btnRepetir = document.getElementById('btnRepetir');

      const maxDim = 1200;
      let w = video.videoWidth || 1280;
      let h = video.videoHeight || 720;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      // Comprime a JPEG ultra rápido (~120 KB)
      base64Comprimido = canvas.toDataURL('image/jpeg', 0.75);

      // Apagamos el stream de video para liberar la RAM por completo
      if (streamActual) {
        streamActual.getTracks().forEach(t => t.stop());
      }
      video.style.display = "none";
      btnCapturar.style.display = "none";

      preview.src = base64Comprimido;
      preview.style.display = "block";
      btnRepetir.style.display = "inline-flex";

      validar();
    }

    function reiniciarCamara() {
      base64Comprimido = "";
      document.getElementById('fotoPreview').style.display = "none";
      document.getElementById('btnRepetir').style.display = "none";
      abrirCamara();
      validar();
    }

    function validar() {
      const nom = document.getElementById('clienteInput').value.trim();
      document.getElementById('btnEnviar').disabled = !(nom !== "" && base64Comprimido !== "");
    }

    async function enviar() {
      const btn = document.getElementById('btnEnviar');
      const cliente = document.getElementById('clienteInput').value.trim();
      btn.disabled = true;
      mostrarEstado("⏳ Guardando en Drive...", "status-info");

      const payload = {
        cliente: cliente,
        telefono: telefonoActual,
        fotoBase64: base64Comprimido
      };

      // Envío robusto con 3 reintentos si parpadea la red 4G
      let intentos = 0;
      while (intentos < 3) {
        try {
          intentos++;
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (data.status === "ok") {
            mostrarEstado("✓ ¡Guardado! Abriendo WhatsApp...", "status-ok");
            localStorage.removeItem('cliente_temp');
            
            // Abrir WhatsApp de inmediato
            window.location.href = data.urlWhatsApp;
            return;
          } else {
            throw new Error(data.message || "Error del servidor");
          }
        } catch (err) {
          if (intentos >= 3) {
            mostrarEstado("Error de red al subir. Intenta de nuevo.", "status-error");
            btn.disabled = false;
          } else {
            mostrarEstado("Reconectando red (intento " + (intentos + 1) + "/3)...", "status-info");
            await new Promise(r => setTimeout(r, 1200));
          }
        }
      }
    }

    function mostrarEstado(txt, clase) {
      const box = document.getElementById('statusBox');
      box.className = clase;
      box.innerText = txt;
    }
  </script>
</body>
</html>
